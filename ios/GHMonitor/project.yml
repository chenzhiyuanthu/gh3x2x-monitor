name: GHMonitor
options:
  bundleIdPrefix: com.chenzhiyuan
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: 493WT6Z4J4
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
targets:
  GHMonitor:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources
      - path: Resources
        buildPhase: resources
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: GH Monitor
        CFBundleName: GHMonitor
        NSBluetoothAlwaysUsageDescription: GH Monitor connects to the Goodix GH3x2x sensor over Bluetooth to read heart rate and blood oxygen.
        NSBluetoothPeripheralUsageDescription: GH Monitor connects to the Goodix GH3x2x sensor over Bluetooth.
        UIBackgroundModes: [bluetooth-central]
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIUserInterfaceStyle: Dark
        ITSAppUsesNonExemptEncryption: false
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.chenzhiyuan.ghmonitor
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_STRICT_CONCURRENCY: minimal
        ENABLE_USER_SCRIPT_SANDBOXING: false
