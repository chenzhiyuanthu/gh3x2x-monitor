name: GHMonitor
options:
  bundleIdPrefix: com.chenzhiyuan
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: 493WT6Z4J4
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  GHMonitor:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources
      - path: Resources
        buildPhase: resources
    dependencies:
      - target: GHMonitorWatch
    entitlements:
      path: GHMonitor.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: GH Monitor
        CFBundleName: GHMonitor
        NSBluetoothAlwaysUsageDescription: GH Monitor connects to the Goodix GH3x2x sensor over Bluetooth to read heart rate and blood oxygen.
        NSBluetoothPeripheralUsageDescription: GH Monitor connects to the Goodix GH3x2x sensor over Bluetooth.
        NSHealthShareUsageDescription: The GH Watch app reads heart rate during workouts to record it alongside the sensor data.
        NSHealthUpdateUsageDescription: The GH Watch app saves the recording session as a workout.
        UIBackgroundModes: [bluetooth-central]
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIUserInterfaceStyle: Dark
        ITSAppUsesNonExemptEncryption: false
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.chenzhiyuan.ghmonitor
        TARGETED_DEVICE_FAMILY: "1"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_STRICT_CONCURRENCY: minimal
        ENABLE_USER_SCRIPT_SANDBOXING: false
  GHMonitorWatch:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: Watch
    entitlements:
      path: Watch/GHMonitorWatch.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
    info:
      path: Watch/Info.plist
      properties:
        CFBundleDisplayName: GH Watch
        CFBundleName: GHMonitorWatch
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.chenzhiyuan.ghmonitor
        WKBackgroundModes: [workout-processing]
        NSHealthShareUsageDescription: Reads heart rate during the recording session.
        NSHealthUpdateUsageDescription: Saves the recording session as a workout so the watch samples heart rate continuously.
        NSMotionUsageDescription: Records the accelerometer and gyroscope at high rate during the session.
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.chenzhiyuan.ghmonitor.watchkitapp
        TARGETED_DEVICE_FAMILY: "4"
        WATCHOS_DEPLOYMENT_TARGET: "10.0"
        SWIFT_STRICT_CONCURRENCY: minimal
        ENABLE_USER_SCRIPT_SANDBOXING: false
        GENERATE_INFOPLIST_FILE: false
